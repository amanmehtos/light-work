[package]
name = "light-week-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Light Week desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# A task manager people leave open should not be a large download.
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
