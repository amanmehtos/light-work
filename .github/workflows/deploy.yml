name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one half-way: a cancelled
# `d1 migrations apply` leaves the schema in an unknown state.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fail early and clearly on a missing, bad or under-scoped token, rather
      # than part-way through a deploy.
      #
      # `wrangler whoami` exits 0 when it is not authenticated — it reports that
      # it has no credentials and succeeds — so on its own this step waved an
      # empty secret straight through and the run died at the migration instead.
      # The secrets are therefore checked before it, and its output after it.
      - name: Check the token
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?is empty — add it under Settings → Secrets and variables → Actions}"
          : "${CLOUDFLARE_ACCOUNT_ID:?is empty — add it under Settings → Secrets and variables → Actions}"
          npx wrangler whoami | tee whoami.txt
          grep -q 'Account ID' whoami.txt || { echo "::error::the token is set but authenticates no account"; exit 1; }
          rm -f whoami.txt

      - run: pnpm build:web

      # Before the deploy, so a failed migration blocks the release rather
      # than shipping code against the old schema. The migrations here are
      # forward-only and additive, so an older Worker still runs against a
      # newer schema if a rollback is needed.
      - name: Apply database migrations
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply light-week-auth --remote

      - name: Deploy
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Deployed, but is it alive? /healthz is the API whichever way the
      # service is deployed — in the combined deployment the app owns /.
      - name: Smoke the deployment
        if: vars.PUBLIC_URL != ''
        run: |
          curl -sf --retry 5 --retry-delay 3 "${{ vars.PUBLIC_URL }}/healthz" | tee /dev/stderr | grep -q '"ok":true'
