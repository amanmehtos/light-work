name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit and integration tests
        # The API tests run in workerd against a real Durable Object and D1,
        # so this covers the Workers runtime too.
        run: pnpm -r test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @light/web exec playwright install --with-deps chromium

      # Deliberately the deployed shape — one Worker serving both the built app
      # and the API from one origin — rather than the dev server with its /api
      # proxy. The proxy forwards everything, so it cannot catch a path the
      # asset router steals from the Worker; that is exactly how `POST /sync`
      # once reached production config as a 405.
      - name: Build the app
        run: pnpm build:web

      - name: Start the combined Worker
        working-directory: services/api
        run: |
          npx wrangler d1 migrations apply light-week-auth --local
          echo 'DEV_LOGIN=1' > .dev.vars
          npx wrangler dev --port 8788 --ip 127.0.0.1 &
          until curl -sf http://127.0.0.1:8788/healthz >/dev/null; do sleep 1; done

      - name: Check the app and the API share one origin
        run: |
          curl -sf http://127.0.0.1:8788/healthz | grep -q light-week-api
          curl -sf http://127.0.0.1:8788/ | grep -q "<!doctype html>"
          # Any POST the asset router steals comes back 405 rather than 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8788/sync \
            -H 'content-type: application/json' -d '{"version":1,"since":0,"ops":[]}')" = "401"

      - name: End-to-end
        env:
          APP_URL: http://127.0.0.1:8788
        run: pnpm --filter @light/web test:e2e
